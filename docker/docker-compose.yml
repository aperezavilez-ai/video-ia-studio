version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: video-ia-studio-postgres
    environment:
      POSTGRES_DB: video_ia_studio
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - video-ia-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: video-ia-studio-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - video-ia-network

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: video-ia-studio-backend
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-changeme}@postgres:5432/video_ia_studio
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ../backend:/app
      - ../storage:/storage
      - ../film-bible:/film-bible
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - video-ia-network

  # Celery Worker (CPU tasks)
  celery-worker:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.worker
    container_name: video-ia-studio-celery
    command: celery -A app.worker worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-changeme}@postgres:5432/video_ia_studio
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ../backend:/app
      - ../storage:/storage
      - ../film-bible:/film-bible
    depends_on:
      - redis
      - postgres
    networks:
      - video-ia-network

  # Celery Flower (monitoring)
  flower:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.worker
    container_name: video-ia-studio-flower
    command: celery -A app.worker flower --port=5555
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery-worker
    networks:
      - video-ia-network

  # Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: video-ia-studio-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_WS_URL: ws://backend:8000/ws
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - video-ia-network

  # Nginx Proxy
  nginx:
    image: nginx:alpine
    container_name: video-ia-studio-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - video-ia-network

volumes:
  postgres_data:
  redis_data:

networks:
  video-ia-network:
    driver: bridge
